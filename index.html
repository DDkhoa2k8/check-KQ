<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="alert('true')">
        <label for="">Code:</label>
        <input id="input">
        <button type="button" onclick="check()">Check</button>
    </form>
    <p id="out"></p>
    <script>
        async function check() {
            const code = document.getElementById('input').value;
            const bodyData = {
                code: code, 
            };

            const response = await fetch('https://gchsedjronrenjwafuyb.supabase.co/functions/v1/check-code', {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(bodyData)
            });

            if (!response.ok) {
                console.error("Lỗi khi gọi function:", response.statusText);
                return;
            }

            const data = await response.json();
            console.log("Kết quả từ function:", data);

            if (data.data) document.getElementById('out').innerHTML = "Phan thuong:" + data.data.DSTrungThuong.trung_thuong_txt + "\n Thoi gian:" + data.data.thoi_gian;

            return data;
        }
    </script>
</body>
</html>
